services:
  cybervoice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CYBERVOICE_BIND: "0.0.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    volumes:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
